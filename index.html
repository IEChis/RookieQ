<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行业分析工作台</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --card: #ffffff;
      --ink: #2b2b28;
      --muted: #6b6b63;
      --line: #e3ddd0;
      --accent: #2e8b57;
      --accent-soft: #e7f3ec;
      --code-bg: #f1ede4;
      --quote: #f0ece2;
      --table-head: #f3efe6;
      --shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 6px 18px rgba(0, 0, 0, .05);
      --err: #c0392b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181a;
        --paper: #1c1f22;
        --card: #212529;
        --ink: #e8e6e1;
        --muted: #9aa0a6;
        --line: #33383d;
        --accent: #4caf7d;
        --accent-soft: #1d2b24;
        --code-bg: #2a2f33;
        --quote: #262b2f;
        --table-head: #262b2f;
        --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
        --err: #ff6b5e;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
      font-size: 15px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 6px rgba(0, 0, 0, .05);
    }

    .brand {
      font-weight: 700;
      color: var(--accent);
      margin-right: 6px;
      white-space: nowrap;
    }

    .industry-input {
      flex: 1 1 260px;
      min-width: 200px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-size: 14px;
    }

    .btn {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      transition: .15s;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      filter: brightness(1.05);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn.retry-btn {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .token {
      margin-left: auto;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 20px;
    }

    main {
      padding: 18px 16px 80px;
      max-width: 920px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .card-title {
      font-weight: 700;
      font-size: 15.5px;
    }

    .card-status {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    .card-status .dot {
      display: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      animation: blink 1s infinite;
    }

    .card-status.running .dot {
      display: inline-block;
    }

    .card-status.error .stext {
      color: var(--err);
      font-weight: 600;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .2
      }
    }

    .card-body {
      padding: 14px 18px;
      overflow-x: auto;
    }

    .card-body h1,
    .card-body h2,
    .card-body h3,
    .card-body h4 {
      margin: .6em 0 .4em;
      line-height: 1.3;
    }

    .card-body h1 {
      font-size: 1.5em;
    }

    .card-body h2 {
      font-size: 1.3em;
      color: var(--accent);
    }

    .card-body h3 {
      font-size: 1.12em;
    }

    .card-body h4 {
      font-size: 1.02em;
    }

    .card-body p {
      margin: .5em 0;
    }

    .card-body ul,
    .card-body ol {
      margin: .4em 0;
      padding-left: 1.5em;
    }

    .card-body li {
      margin: .25em 0;
    }

    .card-body code {
      background: var(--code-bg);
      padding: 1.5px 5px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .9em;
    }

    .card-body pre {
      background: var(--code-bg);
      padding: 12px 14px;
      border-radius: 8px;
      overflow-x: auto;
    }

    .card-body pre code {
      background: none;
      padding: 0;
    }

    .card-body blockquote {
      margin: .5em 0;
      padding: .4em 12px;
      border-left: 4px solid var(--accent);
      background: var(--quote);
      border-radius: 0 6px 6px 0;
      color: var(--muted);
    }

    .card-body hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 1em 0;
    }

    .card-body a {
      color: var(--accent);
      text-decoration: underline;
    }

    .img-ref {
      font-size: 0.85em;
      color: var(--muted);
      background: var(--accent-soft);
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .tbl-wrap {
      overflow-x: auto;
      margin: .6em 0;
    }

    .card-body table {
      border-collapse: collapse;
      min-width: 100%;
      font-size: 13.5px;
    }

    .card-body th,
    .card-body td {
      border: 1px solid var(--line);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      min-width: 80px;
      max-width: 360px;
    }

    .card-body th {
      background: var(--table-head);
      font-weight: 600;
      white-space: nowrap;
    }

    .card-body td:first-child,
    .card-body th:first-child {
      max-width: 120px;
    }

    .card-footer {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }

    .sel-hint {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .candidate-btn {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .custom-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .custom-input {
      flex: 1 1 240px;
      min-width: 180px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
    }

    .chat-row {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1 1 300px;
      min-width: 200px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
    }

    .round-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 13px;
      color: var(--accent);
    }

    .round-lbl {
      font-weight: 600;
    }

    .round-input {
      width: 62px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      text-align: center;
    }

    .round-cur {
      margin-left: 2px;
      opacity: .85;
    }

    /* settings */
    .settings {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .settings.hidden {
      display: none;
    }

    .settings-inner {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow);
      max-height: 90vh;
      overflow-y: auto;
    }

    .settings-inner h2 {
      margin: 0 0 14px;
      font-size: 18px;
      color: var(--accent);
    }

    .settings-inner label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 12px 0 4px;
    }

    .settings-inner input[type=text],
    .settings-inner input[type=password],
    .settings-inner select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
    }

    .settings-inner .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 14px;
    }

    .settings-inner .check input {
      width: auto;
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .settings-inner .note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.5;
    }

    /* toast */
    #toasts {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .toast {
      background: var(--ink);
      color: var(--paper);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      opacity: 0;
      transition: .3s;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <span class="brand">行业分析工作台</span>
    <input id="industryInput" class="industry-input" placeholder="输入行业名称，如：跨境电商 / 社区团购 / 工业软件…">
    <button id="startBtn" class="btn primary">开始分析</button>
    <button id="stopBtn" class="btn" disabled>停止</button>
    <button id="exportBtn" class="btn">导出 .md</button>
    <button id="settingsBtn" class="btn">⚙ 设置</button>
    <span id="tokenDisplay" class="token">输入 0 · 输出 0</span>
  </header>

  <div id="settings" class="settings hidden">
    <div class="settings-inner">
      <h2>设置</h2>
      <label>API 地址（自动清理尾部斜杠，自动拼 /v1/messages）
        <input id="cfgBaseUrl" type="text" placeholder="https://api.anthropic.com">
      </label>
      <label>API Key（仅存本地浏览器 localStorage）
        <input id="cfgApiKey" type="password" placeholder="sk-... 或三方平台的 key">
      </label>
      <label>模型 ID（自由输入，三方常用 anthropic/claude-opus-5 这类前缀）
        <input id="cfgModel" type="text" list="modelList" placeholder="deepseek-v4-pro">
        <datalist id="modelList">
          <option value="deepseek-v4-pro">
          <option value="anthropic/claude-opus-5">
          <option value="anthropic/claude-sonnet-4-5">
          <option value="anthropic/claude-3-5-sonnet">
          <option value="openai/gpt-5">
          <option value="google/gemini-2.5-pro">
          <option value="qwen-max">
          <option value="moonshot/kimi-k2">
        </datalist>
      </label>
      <label>认证方式
        <select id="cfgAuth">
          <option value="auto">自动（官方 x-api-key / 三方 Bearer）</option>
          <option value="xapikey">强制 x-api-key</option>
          <option value="bearer">强制 Bearer</option>
        </select>
      </label>
      <label>API 格式 / Provider
        <select id="cfgProvider">
          <option value="anthropic">Anthropic Messages（兼容 web_search_20260209）</option>
          <option value="openai-responses">OpenAI Responses（DeepSeek/百炼 web_search）</option>
        </select>
      </label>
      <label class="check"><input id="cfgWeb" type="checkbox"> 联网核实（Anthropic 模式需网关兼容 web_search_20260209；Responses 模式走 tools=[{type:"web_search"}]，DeepSeek 官方/百炼可用）</label>
      <label class="check"><input id="cfgProxy" type="checkbox" checked> 使用本地代理（解决浏览器 CORS 跨域拦截。需先启动
        server.py，关闭后直连上游——仅官方 Anthropic 或支持 CORS 的网关可用）</label>
      <label>从业者拷问轮数
        <input id="cfgRounds" type="number" min="1" max="50" value="15" style="width:70px"> 轮（1-50，到达后模型自动跳出角色给诊断）
      </label>
      <div class="settings-actions">
        <button id="saveSettings" class="btn primary">保存</button>
        <button id="closeSettings" class="btn">关闭</button>
      </div>
      <p class="note">API Key 只保存在你的浏览器 localStorage，不会上传到任何服务器（除你填写的 API 地址外）。切换三方中转平台或需要联网搜索时：改 API 地址、选对应 API 格式、认证方式选「强制 Bearer」、模型 ID 用平台要求的前缀。</p>
    </div>
  </div>

  <main id="cards"></main>
  <div id="toasts"></div>

  <script>
    /* ============================ 内嵌 prompt（逐字，禁止改写） ============================ */
    const SYSTEM_PROMPT = `你是行业分析助手。你在本次任务中必须遵守以下规则，优先级高于一切后续指令：

【证据分级】
你输出的每一个事实性字段，都必须带一个 evidence 标签，只有三档：
  A = 公开可查。必须给出具体出处（公司公告 / 招股书 / 年报 / 监管文件 / 行业协会数据），出处要具体到文件名和年份，不许写"据公开资料"。
  B = 行业常识推断。必须写出推断链条：我从哪个已知事实，通过什么逻辑，推到这个结论。
  C = 纯推测。我没有依据，只是根据同类行业的一般规律猜的。

【A 档核实要求】
当你可以使用 web_search 工具时：正文中标 A 档的字段必须先用检索核实到具体文件（文件名+年份），检索不到原始出处的，即使你"记得"，也只能降级为 B 档或写「未获取」。凭记忆写出的文件名和数字视为编造。
当没有检索工具时：不得标 A 档，最高只能标 B 档并注明"凭记忆，未核实"。

【C 档处理规则】
C 档内容一律不许出现在报告正文里，只能进入结尾的「待验证清单」。
如果某个字段你只能给出 C 档，就在正文里写「未获取」，不要用推测填满它。

【禁止事项】
- 不许用"较强 / 较弱 / 相对集中 / 比较分散"这类无法判定的表述。所有强弱判断必须换算成可判定的量：需要多久、多少钱、多少家、几个月。
- 不许说"总体来看""综合而言"开头的段落。
- 不许在用户没问的时候给建议、给展望、给趋势预测。
- 不许因为用户看起来懂或不懂而调整结论。
- 不要输出图片引用标记（如 @image#1:Clipboard_Screenshot.png）。若搜索结果含图片，请用文字描述其内容或直接忽略。
- 输出 Markdown 表格时，单元格内禁止出现未转义的 \`|（它会被误识别为列分隔符）。如需列举多个条目，用 \`、\` 或 \`；\` 分隔。evidence 列每格控制在 80 字以内，只写最关键出处；更长说明放在表格下方的脚注里，不要塞入单元格。

【态度】
你不需要让用户满意。你需要让用户知道哪些是真的、哪些是你编的。`;

    const PROMPT_STEP0 = (industry) => `我要系统地了解一个行业：${industry}。

在开始之前，先不要给我任何内容。请你做一件事：

这个名称在实际使用中可能指向几个完全不同的行业。请列出 2-4 个候选边界，每个候选写清楚：
  - 这个边界包含什么、明确不包含什么
  - 它的典型玩家是谁（各举 2 个）
  - 选这个边界的话，后面分析的重心会落在哪里

然后问我选哪一个。在我回答之前，不要开始分析。

注意：如果这几个候选之间的差别很小，说明你切分得不对，重切。真正有意义的切分，应该让不同候选的产业链结构明显不同。`;

    const PROMPT_STEP1 = (choice) => `边界已确认：${choice}

现在做结构层。按下面的格式输出，不要写导语和总结。

【产业链分层】
从最上游到最终用户，分成若干层。每一层输出一行：

  层级 | 这一环干什么 | 代表公司(2-3家) | 它靠什么赚钱 | 收入确认时点 | evidence

其中：
- 「它靠什么赚钱」不许写"销售产品"。要写清楚收费方式：按件 / 按量 / 按项目 / 抽佣 / 订阅 / 赚差价 / 赚账期 / 赚返点，以及向谁收（很多行业里，付钱的人和用东西的人不是同一个）。
- 「收入确认时点」写：签约时 / 发货时 / 验收时 / 回款时 / 分期。这一栏后面会用到，不许留空，不知道就写「未获取」。
- 「evidence」列控制在 80 字以内，只写「A/B：文件/年份/关键数字」；超过的内容放到表格下方以「注：」形式补充。

【这条链的特殊之处】
和一般制造业/服务业的标准链条比，这条链多了哪一环、少了哪一环、或者哪一环的位置不一样？只写差异，不写共性。

【我可能画错的地方】
你在分层时做了哪 3 个判断是可能错的？逐条列出。`;

    const PROMPT_STEP2 = () => `基于上面的产业链，现在拆三条流转链。三条分开输出，不要合并。

【钱流】
从最终用户付出的 100 元开始，追踪它依次经过哪些环节。每一跳一行：

  从谁 → 到谁 | 这一跳留下多少(%) | 账期多长 | 谁先垫钱 | evidence

  账期和垫资这两栏是重点。如果不知道，写「未获取」并列入待验证清单，绝对不许用行业平均值或者常识填充。

【货流 / 服务交付流】
东西（或服务）实际怎么从生产端到达用户端。每一跳一行：

  从哪 → 到哪 | 谁掌握控制权 | 谁承担损耗和退货 | 时间多久 | evidence

  注意：货流和钱流的路径经常不一致（比如经销商不碰货只走账，或者平台碰货不碰账）。如果这条链和钱流路径不同，明确指出不同在哪。

【用户流】
用户是怎么被找到、被转化、被留住的。

  获客渠道 | 决策者是谁 | 付钱的是谁 | 使用的是谁 | 复购触发条件 | evidence

  「决策者 / 付钱的 / 使用的」三者是否分离，是这个行业的一个关键特征，必须明确回答是或否。
  所有 evidence 列控制在 80 字以内，超过的出处细节放到表格下方以「注：」补充。

【三条链的错位】

      // 兜底：部分网关/翻译层不返回 usage，按文本长度估算 token，避免计数器始终为 0
      if (!gotUsage && !state.aborted) {
        const outText = assistantText(assistant);
        if (outText) state.tokens.output += approxTokens(outText);
        if (state.tokens.input === 0) {
          const inputText = (body.system ? JSON.stringify(body.system) : '') + JSON.stringify(body.messages);
          state.tokens.input += approxTokens(inputText);
        }
        updateTokenDisplay();
      }
      return { stopReason: stopReason || 'end_turn' };
    }

    function handleSSEEvent(evt, card, assistant) {
      switch (evt.type) {
        case 'message_start': {
          const u = (evt.message && evt.message.usage) || {};
          state.tokens.input += u.input_tokens || 0;
          state.tokens.cacheRead += u.cache_read_input_tokens || 0;
          state.tokens.cacheWrite += u.cache_creation_input_tokens || 0;
          updateTokenDisplay();
          break;
        }
        case 'content_block_start': {
          const cb = evt.content_block;
          const block = JSON.parse(JSON.stringify(cb)); // 深拷贝
          if (block.type === 'text') block.text = '';
          else if (block.type === 'thinking') { block.thinking = ''; block.signature = ''; }
          else if (block.type === 'tool_use' || block.type === 'server_tool_use') { block.partial_json = ''; block.input = {}; }
          const ind = (typeof evt.index === 'number') ? evt.index : assistant.content.length;
          assistant.content[ind] = block;
          if (block.type === 'server_tool_use') {
            card.searchCount++;
            setCardStatus(card, '检索中…（第 ' + card.searchCount + ' 次）', true);
          }
          break;
        }
        case 'content_block_delta': {
          const block = assistant.content[evt.index];
          if (!block) break;
          const d = evt.delta;
          if (d.type === 'text_delta') {
            block.text = (block.text || '') + d.text;
            if (card.isStep5) { if (card._curTurn) card._curTurn.text += d.text; card.raw = renderChatRaw(card); }
            else { card.raw = stepAllText(card); }
          } else if (d.type === 'thinking_delta') {
            block.thinking = (block.thinking || '') + d.thinking;
          } else if (d.type === 'signature_delta') {
            block.signature = (block.signature || '') + d.signature;
          } else if (d.type === 'input_json_delta') {
            block.partial_json = (block.partial_json || '') + d.partial_json;
          }
          break;
        }
        case 'content_block_stop': {
          const block = assistant.content[evt.index];
          if (block && (block.type === 'tool_use' || block.type === 'server_tool_use')) {
            try { block.input = JSON.parse(block.partial_json || '{}'); } catch (e) { block.input = {}; }
            delete block.partial_json;
          }
          break;
        }
        case 'message_delta': {
          const u = evt.usage || {};
          let changed = false;
          if (u.input_tokens) { state.tokens.input += u.input_tokens; changed = true; }
          if (u.output_tokens) { state.tokens.output += u.output_tokens; changed = true; }
          if (u.cache_read_input_tokens) { state.tokens.cacheRead += u.cache_read_input_tokens; changed = true; }
          if (u.cache_creation_input_tokens) { state.tokens.cacheWrite += u.cache_creation_input_tokens; changed = true; }
          if (changed) updateTokenDisplay();
          if (evt.delta && evt.delta.stop_reason) return { stopReason: evt.delta.stop_reason };
          break;
        }
        case 'message_stop': {
          return { stopReason: 'end_turn' };
        }
        case 'error': {
          return { error: (evt.error && evt.error.message) || 'stream error' };
        }
        case 'ping': break;
      }
      return {};
    }

    /* ============================ 一步流式执行（含 pause_turn / 重试 / 400 剥离） ============================ */
    async function streamStep(card, userContent, opts) {
      opts = opts || {};
      const myRun = state.runId;
      const convLenBefore = state.conversation.length;
      state.conversation.push({ role: 'user', content: userContent });
      if (card.isStep5 && !opts.skipUserTurnDisplay) {
        card.turns.push({ role: 'user', text: userContent });
        card.raw = renderChatRaw(card); renderCard(card);
      }
      card._stepAssistants = card._stepAssistants || [];
      let needNewAssistant = true;
      let pauseCount = 0, attempts = 0;
      const stripped = {};
      let lastStop = null;

      while (true) {
        const cardSnapshot = { raw: card.raw, searchCount: card.searchCount };
        let assistant;
        if (needNewAssistant) {
          assistant = { role: 'assistant', content: [] };
          state.conversation.push(assistant);
          card._stepAssistants.push(assistant);
          if (card.isStep5) { const t = { role: 'assistant', text: '' }; card.turns.push(t); card._curTurn = t; }
          needNewAssistant = false;
        } else {
          assistant = state.conversation[state.conversation.length - 1];
          assistant.content = [];
          card.raw = cardSnapshot.raw;
          card.searchCount = cardSnapshot.searchCount;
          if (card.isStep5 && card._curTurn) { card._curTurn.text = ''; card.raw = renderChatRaw(card); }
        }
        const snapshot = { raw: card.raw, searchCount: card.searchCount };
        const body = buildBody(stripped);
        try {
          const res = await sendOneRequest(body, card, assistant);
          if (state.runId !== myRun) { state.conversation.length = convLenBefore; return lastStop; } // 被新分析取代
          lastStop = res.stopReason;
          if (lastStop === 'pause_turn') {
            pauseCount++;
            setCardStatus(card, '续传中…（第 ' + pauseCount + ' 次续传）', true);
            if (pauseCount >= 10) { lastStop = 'end_turn'; break; }
            needNewAssistant = true;
            continue;
          }
          break;
        } catch (e) {
          if (e.type === 'param400') {
            const p = e.param;
            if (stripped[p]) { state.conversation.length = convLenBefore; throw new Error('参数 ' + p + ' 已剥离但仍返回 400：' + (e.message || '')); }
            stripped[p] = true;
            if (p === 'tools') { state.webSearchDowngraded = true; showWarning('该平台不支持检索工具，已降级（本步不再有 A 档）'); }
            continue;
          }
          if (e.retryable && !state.aborted && attempts < 2) {
            attempts++;
            needNewAssistant = false;
            const waitMs = (e.status === 429) ? 10000 : (attempts === 1 ? 2500 : 5000);
            setCardStatus(card, '断流，重试中…（第 ' + attempts + ' 次）', true);
            await sleep(waitMs);
            continue;
          }
          // 致命失败：清理本轮会话状态
          state.conversation.length = convLenBefore;
          if (state.aborted || e.name === 'AbortError') { setCardStatus(card, '已停止', false, true); }
          else if (e.type === 'http' && !e.retryable) { setCardStatus(card, '出错：HTTP ' + e.status + (e.message ? (' · ' + e.message) : ''), false, true); }
          else { setCardStatus(card, '出错：' + (e.message || e.toString()), false, true); }
          throw e;
        }
      }
      // 收尾状态
      if (lastStop === 'refusal') setCardStatus(card, '被安全分类器拒绝', false, true);
      else if (lastStop === 'max_tokens') setCardStatus(card, '完成 · 检索' + card.searchCount + ' 次（可能被截断）', false);
      else setCardStatus(card, '完成' + (card.searchCount ? (' · 检索 ' + card.searchCount + ' 次') : ''), false);
      renderCard(card);
      return lastStop;
    }

    /* ============================ 卡片 UI ============================ */
    function createCard(title, key) {

    function clearCard(card) {

    /* ============================ 候选边界解析与选择 ============================ */
    function parseCandidates(text) {
      const lines = (text || '').split('\n');
      const candRe = /^\s*(#{1,4}\s*)?(候选|边界)\s*([一二三四1-4A-Da-d])\b/;
      const markers = [];
      for (let i = 0; i < lines.length; i++) { if (candRe.test(lines[i])) markers.push(i); }
      let blocks = [];
      if (markers.length >= 2) {
        for (let k = 0; k < markers.length; k++) {
          const start = markers[k];
          const end = (k + 1 < markers.length) ? markers[k + 1] : lines.length;
          blocks.push(lines.slice(start, end).join('\n').trim());
        }
      } else {
        const numRe = /^\s*(#{1,4}\s*)?\d+\s*[\.、]/;
        const nm = [];
        for (let i = 0; i < lines.length; i++) { if (numRe.test(lines[i])) nm.push(i); }
        if (nm.length >= 2 && nm.length <= 6) {
          for (let k = 0; k < nm.length; k++) {
            const start = nm[k];
            const end = (k + 1 < nm.length) ? nm[k + 1] : lines.length;
            blocks.push(lines.slice(start, end).join('\n').trim());
          }
        }
      }
      if (blocks.length > 4) blocks = blocks.slice(0, 4);
      return blocks;
    }

        const cn = ['一', '二', '三', '四'];
        cands.forEach((c, idx) => {

          b.textContent = '候选' + cn[idx];
          b.onclick = () => selectBoundary(c);
          btnRow.appendChild(b);

    }
    function selectBoundary(choice) {

    /* ============================ 流水线 ============================ */
    function runSteps1to4() {
      const steps = state.pipelineSteps = [
        { key: 'step1', content: () => PROMPT_STEP1(state.selectedChoice) },
        { key: 'step2', content: () => PROMPT_STEP2() },
        { key: 'step3', content: () => PROMPT_STEP3() },
        { key: 'step4', content: () => PROMPT_STEP4() },
      ];
      (async () => {
        const myRun = state.runId;
        for (let i = 0; i < steps.length; i++) {
          if (state.aborted || state.runId !== myRun) break;
          const def = steps[i];
          const card = state.cards[def.key] || createCard(STEP_DEFS[def.key].title, def.key);
          try {
            await streamStep(card, def.content(), {});
            if (state.runId !== myRun) return;
          } catch (e) {
            setupRetry(card, def, i, steps);
            return;
          }
        }
        if (!state.aborted && state.runId === myRun) showStep5Entry();
      })();
    }

    function setupRetry(card, def, index, pipelineSteps) {
      card.retryFn = makeRetry(card, def, index, pipelineSteps);
      showRetryButton(card);
    }
    function makeRetry(card, def, index, pipelineSteps) {
      return async function () {
        if (!state.config.apiKey) { openSettings(); return; }
        state.aborted = false;
        state.abortController = new AbortController();
        updateStopButton();
        clearCard(card);
        const myRun = state.runId;
        try {
          await streamStep(card, def.content(), {});
          if (state.runId !== myRun) return;
          if (def.key === 'step0') { showSelectionControls(card, parseCandidates(card.raw)); return; }
          if (pipelineSteps) {
            for (let j = index + 1; j < pipelineSteps.length; j++) {
              if (state.aborted || state.runId !== myRun) break;
              const d = pipelineSteps[j];
              const c = state.cards[d.key] || createCard(STEP_DEFS[d.key].title, d.key);
              clearCard(c);
              try { await streamStep(c, d.content(), {}); }
              catch (e) { setupRetry(c, d, j, pipelineSteps); return; }
            }
            if (!state.aborted && state.runId === myRun) showStep5Entry();
          }
        } catch (e) {
          setupRetry(card, def, index, pipelineSteps);
        }
      };
    }

      (async () => {

    }
    function setupRetryStep5(card) {
      if (card.turns.length && card.turns[card.turns.length - 1].role === 'assistant') card.turns.pop();
      if (card.turns.length && card.turns[card.turns.length - 1].role === 'user') card.turns.pop();
      card.raw = renderChatRaw(card); renderCard(card);
      card.footerEl.querySelector('.retry-btn')?.remove();
      const b = document.createElement('button'); b.className = 'btn retry-btn'; b.textContent = '重试发送';
      b.onclick = () => { b.remove(); chatSend(card, card._lastUser || ''); };
      card.footerEl.insertBefore(b, card.footerEl.firstChild);
    }

    /* ============================ 顶栏动作 ============================ */
    function resetAll() {
      state.conversation = []; state.selectedChoice = '';
      state.tokens = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
      state.webSearchDowngraded = false;
      state.cards = {}; state.cardOrder = [];
      document.getElementById('cards').innerHTML = '';
      updateTokenDisplay();
    }
    function updateTokenDisplay() {
      document.getElementById('tokenDisplay').textContent =
        '输入 ' + state.tokens.input.toLocaleString() + ' · 输出 ' + state.tokens.output.toLocaleString();
    }
    function updateStopButton() {
      document.getElementById('stopBtn').disabled = !state.abortController || state.aborted;
    }
    async function startAnalysis() {
      const industry = document.getElementById('industryInput').value.trim();
      if (!industry) { alert('请输入行业名称'); return; }
      if (!state.config.apiKey) { openSettings(); alert('请先在设置中填写 API Key'); return; }
      state.industry = industry;
      if (state.abortController) state.abortController.abort();
      resetAll();
      state.abortController = new AbortController();
      state.aborted = false;
      state.runId++;
      updateStopButton();
      const card = createCard(STEP_DEFS.step0.title, 'step0');
      try {
        await streamStep(card, PROMPT_STEP0(industry), {});
        showSelectionControls(card, parseCandidates(card.raw));
      } catch (e) {
        setupRetry(card, { key: 'step0', content: () => PROMPT_STEP0(industry) }, -1, null);
      }
    }
    function exportMd() {
      let md = '# 行业分析报告\n\n';
      for (const id of state.cardOrder) {
        const c = state.cards[id];
        if (!c) continue;
        if (c.key === 'step5entry') continue;
        md += '## ' + c.title + '\n\n';
        md += (getExportRaw(c) || '') + '\n\n';
      }
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '行业分析报告.md';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    /* ============================ 设置面板 ============================ */
    function openSettings() {
      document.getElementById('settings').classList.remove('hidden');
    }
    function toggleSettings(forceClose) {
      const s = document.getElementById('settings');
      if (forceClose) s.classList.add('hidden');
      else s.classList.toggle('hidden');
    }
    function readSettings() {
      state.config.baseUrl = document.getElementById('cfgBaseUrl').value.trim() || 'https://api.anthropic.com';
      state.config.apiKey = document.getElementById('cfgApiKey').value.trim();
      state.config.model = document.getElementById('cfgModel').value.trim() || 'deepseek-v4-pro';
      state.config.authMode = document.getElementById('cfgAuth').value;
      state.config.provider = document.getElementById('cfgProvider').value || 'anthropic';
      state.config.webSearch = document.getElementById('cfgWeb').checked;
      state.config.useProxy = document.getElementById('cfgProxy').checked;
      state.config.chatRounds = Math.max(1, Math.min(50, parseInt(document.getElementById('cfgRounds').value) || 15));
      // 若正在聊天，同步卡片上的实时轮数控制条
      for (const id of state.cardOrder) {
        const c = state.cards[id];
        if (c && c.roundInput) { c.roundInput.value = state.config.chatRounds; if (c._refreshRound) c._refreshRound(); }
      }
    }

    /* ============================ Toast ============================ */
    function showWarning(msg) {
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
      document.getElementById('toasts').appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 4000);
    }

    /* ============================ 初始化 ============================ */
    document.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      document.getElementById('cfgBaseUrl').value = state.config.baseUrl;
      document.getElementById('cfgApiKey').value = state.config.apiKey;
      document.getElementById('cfgModel').value = state.config.model;
      document.getElementById('cfgAuth').value = state.config.authMode;
      document.getElementById('cfgProvider').value = state.config.provider || 'anthropic';
      document.getElementById('cfgWeb').checked = state.config.webSearch;
      document.getElementById('cfgProxy').checked = state.config.useProxy;
      document.getElementById('cfgRounds').value = state.config.chatRounds || 15;
      document.getElementById('startBtn').onclick = startAnalysis;
      document.getElementById('industryInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); startAnalysis(); }
      });
      document.getElementById('stopBtn').onclick = () => {
        if (!state.abortController) return;
        state.abortController.abort();
        state.aborted = true;
        updateStopButton();
        // 如果已有会话内容，立即输出基于现有内容的诊断
        if (state.conversation.length > 0) {
          triggerImmediateDiagnosis();
        }
      };
      document.getElementById('exportBtn').onclick = exportMd;
      document.getElementById('settingsBtn').onclick = () => toggleSettings();
      document.getElementById('saveSettings').onclick = () => { readSettings(); saveConfig(); toggleSettings(true); showWarning('设置已保存（仅在本地）'); };
      document.getElementById('closeSettings').onclick = () => toggleSettings(true);
      if (!state.config.apiKey) openSettings();
    });
  </script>
</body>

</html>
